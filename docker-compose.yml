    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8188/system_stats"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 300s
    restart: unless-stopped

  # ComfyUI: Flux.2-klein 9B distilled FP8 DiT + Comfy-Org FP4 TE + flux2-vae. Port 8189.
  # Weights ~16.5 GB total — partial offload on 12 GB; better on 16–24 GB. DiT is gated (HF_TOKEN).
  flux2_klein_9b_comfy_gpu:
    build: ./flux2-klein-9b-comfy
    container_name: flux2-klein-9b-comfy-gpu
    ports:
      - "8189:8189"
