      - ./cache/z-image-turbo-comfy/split_files/diffusion_models:/app/ComfyUI/models/diffusion_models:ro
      - ./cache/z-image-turbo-comfy/split_files/text_encoders:/app/ComfyUI/models/text_encoders:ro
      - ./cache/z-image-turbo-comfy/split_files/vae:/app/ComfyUI/models/vae:ro
      - ./cache/z-image-turbo-comfy/output:/app/ComfyUI/output
    gpus: all
