      NUM_FRAMES: "9"
      FPS: "16"
      STEPS: "50"
      GUIDANCE_SCALE: "6.0"
      FLOW_SHIFT: "3.0"
      DEVICE_MODE: cuda
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./cache/wan-t2v:/cache/huggingface
    gpus: all
    profiles: ["gpu"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/health"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 1800s
    restart: unless-stopped

  # ComfyUI smoke host for Comfy-Org Z-Image-Turbo quant packs (INT8/FP4). Port 8188.
  z_image_comfy_gpu:
    build: ./z-image-comfy
    container_name: z-image-comfy-gpu
    ports:
      - "8188:8188"
