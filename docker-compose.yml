      HF_HOME: /cache/huggingface
      HEIGHT: "512"
      WIDTH: "512"
      STEPS: "4"
      GUIDANCE_SCALE: "1.0"
      DEVICE_MODE: sequential
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - flux2-klein-9b-kv-cache:/cache/huggingface
    gpus: all
    profiles: ["gpu"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8126/health"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 1800s
    restart: unless-stopped

  # FLUX.2 [klein] 4B text-to-image (diffusers). Official ~13GB with CPU offload.
  # On 12GB cards: keep HEIGHT/WIDTH at 512 and DEVICE_MODE=offload; stop other GPU services.
  flux2_klein_gpu:
    build: ./flux2-klein
    container_name: flux2-klein-4b-gpu
    ports:
      - "8116:8116"
    environment:
      PORT: "8116"
      MODEL_ID: black-forest-labs/FLUX.2-klein-4B
      HF_HOME: /cache/huggingface
      HEIGHT: "512"
      WIDTH: "512"
      STEPS: "4"
      GUIDANCE_SCALE: "1.0"
      # sequential: stream layers (good on 12GB). cuda thrashing on 3060 (~156s/img).
      DEVICE_MODE: sequential
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - flux2-klein-cache:/cache/huggingface
    gpus: all
    profiles: ["gpu"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8116/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 900s
    restart: unless-stopped

  # Juggernaut XL v9 (SDXL photoreal). ~8GB VRAM. CreativeML Open RAIL-M.
  juggernaut_xl_gpu:
    build: ./juggernaut-xl
    container_name: juggernaut-xl-v9-gpu
    ports:
      - "8117:8117"
    environment:
      PORT: "8117"
      MODEL_ID: RunDiffusion/Juggernaut-XL-v9
      HF_HOME: /cache/huggingface
      HEIGHT: "1216"
      WIDTH: "832"
      STEPS: "30"
      GUIDANCE_SCALE: "5.0"
      DEVICE_MODE: cuda
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - juggernaut-xl-cache:/cache/huggingface
    gpus: all
    profiles: ["gpu"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8117/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 900s
    restart: unless-stopped

  # Juggernaut XI v11 (SDXL). Gated HF + CC BY-NC-ND. Same settings family as XL v9.
  juggernaut_xi_gpu:
    build: ./juggernaut-xi
    container_name: juggernaut-xi-v11-gpu
    ports:
      - "8125:8125"
    environment:
      PORT: "8125"
      MODEL_ID: RunDiffusion/Juggernaut-XI-v11
      HF_HOME: /cache/huggingface
      HEIGHT: "1216"
      WIDTH: "832"
      STEPS: "35"
      GUIDANCE_SCALE: "5.0"
      DEVICE_MODE: cuda
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - juggernaut-xi-cache:/cache/huggingface
    gpus: all
    profiles: ["gpu"]
    healthcheck:
