services:
  qwen:
    build: .
    container_name: qwen3-0.6b
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      MODEL_FILE: qwen3-0.6b-q4_k_m.gguf
      MODEL_URL: https://huggingface.co/Antigma/Qwen3-0.6B-GGUF/resolve/main/qwen3-0.6b-q4_k_m.gguf
      N_CTX: ${N_CTX:-2048}
      N_THREADS: ${N_THREADS:-4}
      N_PREDICT: ${N_PREDICT:-256}
      N_PARALLEL: ${N_PARALLEL:-1}
      REASONING: ${REASONING:-auto}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/models
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  qwen35:
    build: .
    container_name: qwen3.5-0.8b
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      MODEL_FILE: Qwen3.5-0.8B-Q4_K_M.gguf
      MODEL_URL: https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_K_M.gguf
      N_CTX: ${N_CTX:-2048}
      N_THREADS: ${N_THREADS:-4}
      N_PREDICT: ${N_PREDICT:-256}
      N_PARALLEL: ${N_PARALLEL:-1}
      REASONING: "off"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/models
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  lfm25:
    build: .
    container_name: lfm2.5-2.6b
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      MODEL_FILE: LFM2.5-2.6B-Q4_0.gguf
      MODEL_URL: https://huggingface.co/LiquidAI/LFM2.5-2.6B-GGUF/resolve/main/LFM2.5-2.6B-Q4_0.gguf
      N_CTX: ${N_CTX:-2048}
      N_THREADS: ${N_THREADS:-4}
      N_PREDICT: ${N_PREDICT:-256}
      N_PARALLEL: ${N_PARALLEL:-1}
      REASONING: "off"
      REASONING_BUDGET: "0"
      REASONING_FORMAT: "deepseek"
      CHAT_TEMPLATE_FILE: /templates/lfm25-no-think.jinja
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/models
      - ./templates:/templates:ro
    # Q4_0 weights alone are ~1.59GB — 2g is too tight
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  qwen35_2b:
    build: .
    container_name: qwen3.5-2b
    ports:
      - "8083:8083"
    environment:
      PORT: "8083"
      MODEL_FILE: Qwen3.5-2B-Q4_K_M.gguf
      MODEL_URL: https://huggingface.co/unsloth/Qwen3.5-2B-GGUF/resolve/main/Qwen3.5-2B-Q4_K_M.gguf
      N_CTX: ${N_CTX:-2048}
      N_THREADS: ${N_THREADS:-4}
      N_PREDICT: ${N_PREDICT:-256}
      N_PARALLEL: ${N_PARALLEL:-1}
      N_GPU_LAYERS: "0"
      REASONING: "off"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/models
    # Q4_K_M weights ~1.28GB
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  qwen35_2b_gpu:
    build:
      context: .
      dockerfile: Dockerfile.cuda
    container_name: qwen3.5-2b-gpu
    ports:
      - "8100:8100"
    environment:
      PORT: "8100"
      MODEL_FILE: Qwen3.5-2B-Q4_K_M.gguf
      MODEL_URL: https://huggingface.co/unsloth/Qwen3.5-2B-GGUF/resolve/main/Qwen3.5-2B-Q4_K_M.gguf
      N_CTX: ${N_CTX:-2048}
      N_THREADS: ${N_THREADS:-4}
      N_PREDICT: ${N_PREDICT:-256}
      N_PARALLEL: ${N_PARALLEL:-1}
      N_GPU_LAYERS: ${N_GPU_LAYERS:-99}
      REASONING: "off"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/models
    gpus: all
    profiles: ["gpu"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  qwen35_4b_gpu:
    build:
      context: .
      dockerfile: Dockerfile.cuda
    container_name: qwen3.5-4b-gpu
    ports:
      - "8102:8102"
    environment:
      PORT: "8102"
      MODEL_FILE: Qwen3.5-4B-Q4_K_M.gguf
      MODEL_URL: https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf
      N_CTX: ${N_CTX:-2048}
      N_THREADS: ${N_THREADS:-4}
      N_PREDICT: ${N_PREDICT:-256}
      N_PARALLEL: ${N_PARALLEL:-1}
      N_GPU_LAYERS: ${N_GPU_LAYERS:-99}
      REASONING: "off"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/models
    gpus: all
    profiles: ["gpu"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8102/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s
    restart: unless-stopped

  # Identical to qwen35_4b_gpu (:8102) except --no-mmproj (vLLM --language-model-only).
  qwen35_4b_nommproj_gpu:
    build:
      context: .
      dockerfile: Dockerfile.cuda
    container_name: qwen3.5-4b-nommproj-gpu
    ports:
      - "8111:8111"
    environment:
      PORT: "8111"
      MODEL_FILE: Qwen3.5-4B-Q4_K_M.gguf
      MODEL_URL: https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf
      NO_MMPROJ: "1"
      N_CTX: ${N_CTX:-2048}
      N_THREADS: ${N_THREADS:-4}
      N_PREDICT: ${N_PREDICT:-256}
      N_PARALLEL: ${N_PARALLEL:-1}
      N_GPU_LAYERS: ${N_GPU_LAYERS:-99}
      REASONING: "off"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/models
    gpus: all
    profiles: ["gpu"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8111/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s
    restart: unless-stopped

  # Same 4B family as :8102, but Unsloth MTP GGUF (heads in-file, no 0.8B).
  # vLLM: --speculative-config method=qwen3_next_mtp num_speculative_tokens=2
  #        --reasoning-parser qwen3 --language-model-only --tensor-parallel-size 1
  qwen35_4b_spec_gpu:
    build:
      context: .
      dockerfile: Dockerfile.cuda
    container_name: qwen3.5-4b-spec-gpu
    ports:
      - "8110:8110"
    environment:
      PORT: "8110"
      MODEL_FILE: Qwen3.5-4B-MTP-Q4_K_M.gguf
      MODEL_URL: https://huggingface.co/unsloth/Qwen3.5-4B-MTP-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf
      SPEC_TYPE: draft-mtp
      SPEC_DRAFT_N_MAX: "2"
      FLASH_ATTN: "on"
      NO_MMPROJ: "1"
      N_CTX: ${N_CTX:-2048}
      N_THREADS: ${N_THREADS:-4}
      N_PREDICT: ${N_PREDICT:-256}
      N_PARALLEL: ${N_PARALLEL:-1}
      N_GPU_LAYERS: ${N_GPU_LAYERS:-99}
      REASONING: "off"
      REASONING_BUDGET: "0"
      REASONING_FORMAT: "deepseek"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/models
    gpus: all
    profiles: ["gpu"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8110/health"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 180s
    restart: unless-stopped

  # Same MTP GGUF as :8110 plus ngram-mod (Reddit 665% trick: hash reuse on
  # iterative code rewrites, no extra draft file). Stacks with MTP.
  qwen35_4b_ngram_gpu:
    build:
      context: .
      dockerfile: Dockerfile.cuda
    container_name: qwen3.5-4b-ngram-gpu
    ports:
      - "8112:8112"
    environment:
      PORT: "8112"
      MODEL_FILE: Qwen3.5-4B-MTP-Q4_K_M.gguf
      MODEL_URL: https://huggingface.co/unsloth/Qwen3.5-4B-MTP-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf
      SPEC_TYPE: draft-mtp,ngram-mod
      SPEC_DRAFT_N_MAX: "2"
      SPEC_NGRAM_MOD_N_MATCH: "24"
      SPEC_NGRAM_MOD_N_MIN: "12"
      SPEC_NGRAM_MOD_N_MAX: "48"
      FLASH_ATTN: "on"
      NO_MMPROJ: "1"
      N_CTX: ${N_CTX:-2048}
      N_THREADS: ${N_THREADS:-4}
      N_PREDICT: ${N_PREDICT:-256}
      N_PARALLEL: ${N_PARALLEL:-1}
      N_GPU_LAYERS: ${N_GPU_LAYERS:-99}
      REASONING: "off"
      REASONING_BUDGET: "0"
      REASONING_FORMAT: "deepseek"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/models
    gpus: all
    profiles: ["gpu"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8112/health"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 180s
    restart: unless-stopped

  # Same as :8112 (MTP + ngram-mod) but N_PARALLEL=4 for concurrency testing.
  qwen35_4b_ngram_np4_gpu:
    build:
      context: .
      dockerfile: Dockerfile.cuda
    container_name: qwen3.5-4b-ngram-np4-gpu
    ports:
      - "8115:8115"
    environment:
      PORT: "8115"
      MODEL_FILE: Qwen3.5-4B-MTP-Q4_K_M.gguf
      MODEL_URL: https://huggingface.co/unsloth/Qwen3.5-4B-MTP-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf
      SPEC_TYPE: draft-mtp,ngram-mod
      SPEC_DRAFT_N_MAX: "2"
      SPEC_NGRAM_MOD_N_MATCH: "24"
      SPEC_NGRAM_MOD_N_MIN: "12"
      SPEC_NGRAM_MOD_N_MAX: "48"
      FLASH_ATTN: "on"
      NO_MMPROJ: "1"
      N_CTX: ${N_CTX:-2048}
      N_THREADS: ${N_THREADS:-4}
      N_PREDICT: ${N_PREDICT:-256}
      N_PARALLEL: "4"
      N_GPU_LAYERS: ${N_GPU_LAYERS:-99}
      REASONING: "off"
      REASONING_BUDGET: "0"
      REASONING_FORMAT: "deepseek"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/models
    gpus: all
    profiles: ["gpu"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8115/health"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 180s
    restart: unless-stopped

  # Ministral 3B GPU — same GGUF as CPU :8084
  ministral3_gpu:
    build:
      context: .
      dockerfile: Dockerfile.cuda
    container_name: ministral-3-3b-gpu
    ports:
      - "8114:8114"
    environment:
      PORT: "8114"
      MODEL_FILE: Ministral-3-3B-Instruct-2512-Q4_K_M.gguf
      MODEL_URL: https://huggingface.co/mistralai/Ministral-3-3B-Instruct-2512-GGUF/resolve/main/Ministral-3-3B-Instruct-2512-Q4_K_M.gguf
      N_CTX: ${N_CTX:-2048}
      N_THREADS: ${N_THREADS:-4}
      N_PREDICT: ${N_PREDICT:-256}
      N_PARALLEL: ${N_PARALLEL:-1}
      N_GPU_LAYERS: ${N_GPU_LAYERS:-99}
      REASONING: "off"
      REASONING_BUDGET: "0"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/models
    gpus: all
    profiles: ["gpu"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8114/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s
    restart: unless-stopped

  # IBM Granite 4.1 8B — Apache 2.0, tool-calling, FIM, multilingual.
  granite41_8b_gpu:
    build:
      context: .
      dockerfile: Dockerfile.cuda
    container_name: granite-4.1-8b-gpu
    ports:
      - "8113:8113"
    environment:
      PORT: "8113"
      MODEL_FILE: granite-4.1-8b-Q4_K_M.gguf
      MODEL_URL: https://huggingface.co/ibm-granite/granite-4.1-8b-GGUF/resolve/main/granite-4.1-8b-Q4_K_M.gguf
      N_CTX: ${N_CTX:-2048}
      N_THREADS: ${N_THREADS:-4}
      N_PREDICT: ${N_PREDICT:-256}
      N_PARALLEL: ${N_PARALLEL:-1}
      N_GPU_LAYERS: ${N_GPU_LAYERS:-99}
      REASONING: "off"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/models
    gpus: all
    profiles: ["gpu"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8113/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s
    restart: unless-stopped

  # Same Unsloth 4B target as qwen35_4b_gpu (:8102) plus z-lab DFlash drafter
  # (AtomicChat GGUF). Does not replace :8102. Exclusive GPU on a 12 GB card.
  qwen35_4b_dflash_gpu:
    build:
      context: .
      dockerfile: Dockerfile.cuda
    container_name: qwen3.5-4b-dflash-gpu
    ports:
      - "8109:8109"
    environment:
      PORT: "8109"
      MODEL_FILE: Qwen3.5-4B-Q4_K_M.gguf
      MODEL_URL: https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf
      DRAFT_FILE: Qwen3.5-4B-DFlash.Q8_0.gguf
      DRAFT_URL: https://huggingface.co/AtomicChat/Qwen3.5-4B-DFlash-GGUF/resolve/main/Qwen3.5-4B-DFlash.Q8_0.gguf
      SPEC_TYPE: draft-dflash
      SPEC_DRAFT_N_MAX: "15"
      N_GPU_LAYERS_DRAFT: "99"
      FLASH_ATTN: "on"
      N_CTX: "32768"
      N_THREADS: ${N_THREADS:-4}
      N_PREDICT: "1536"
      N_PARALLEL: "1"
      N_GPU_LAYERS: ${N_GPU_LAYERS:-99}
      REASONING: "off"
      REASONING_BUDGET: "0"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/models
    gpus: all
    profiles: ["gpu"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8109/health"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 300s
    restart: unless-stopped

  qwen35_9b_gpu:
    build:
      context: .
      dockerfile: Dockerfile.cuda
    container_name: qwen3.5-9b-gpu
    ports:
      - "8103:8103"
    environment:
      PORT: "8103"
      MODEL_FILE: Qwen3.5-9B-Q4_K_M.gguf
      MODEL_URL: https://huggingface.co/unsloth/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q4_K_M.gguf
      N_CTX: ${N_CTX:-2048}
      N_THREADS: ${N_THREADS:-4}
      N_PREDICT: ${N_PREDICT:-256}
      N_PARALLEL: ${N_PARALLEL:-1}
      N_GPU_LAYERS: ${N_GPU_LAYERS:-99}
      REASONING: "off"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/models
    gpus: all
    profiles: ["gpu"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8103/health"]
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 300s
    restart: unless-stopped

  # Same Q4_K_M as :8103 + Unsloth mmproj-F16 (vision). Stop other GPU services on 12GB.
  qwen35_9b_mmproj_gpu:
    build:
      context: .
      dockerfile: Dockerfile.cuda
    container_name: qwen3.5-9b-mmproj-gpu
    ports:
      - "8132:8132"
    environment:
      PORT: "8132"
      MODEL_FILE: Qwen3.5-9B-Q4_K_M.gguf
      MODEL_URL: https://huggingface.co/unsloth/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q4_K_M.gguf
      MMPROJ_FILE: Qwen3.5-9B-mmproj-F16.gguf
      MMPROJ_URL: https://huggingface.co/unsloth/Qwen3.5-9B-GGUF/resolve/main/mmproj-F16.gguf
      # Vision tokens are large; 2048 often OOMs the prompt on a single image.
      N_CTX: ${N_CTX_MMPROJ:-24576}
      N_THREADS: ${N_THREADS:-4}
      N_PREDICT: ${N_PREDICT:-256}
      N_PARALLEL: ${N_PARALLEL:-1}
      N_GPU_LAYERS: ${N_GPU_LAYERS:-99}
      REASONING: "off"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/models
    gpus: all
    profiles: ["gpu"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8132/health"]
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 360s
    restart: unless-stopped

  phi4_mini_gpu:
    build:
      context: .
      dockerfile: Dockerfile.cuda
    container_name: phi4-mini-gpu
    ports:
      - "8107:8107"
    environment:
      PORT: "8107"
      MODEL_FILE: microsoft_Phi-4-mini-reasoning-Q4_K_M.gguf
      MODEL_URL: https://huggingface.co/bartowski/microsoft_Phi-4-mini-reasoning-GGUF/resolve/main/microsoft_Phi-4-mini-reasoning-Q4_K_M.gguf
      N_CTX: "8192"
      N_THREADS: ${N_THREADS:-4}
      N_PREDICT: "1536"
      N_PARALLEL: ${N_PARALLEL:-1}
      N_GPU_LAYERS: ${N_GPU_LAYERS:-99}
      REASONING: "off"
      REASONING_BUDGET: "0"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/models
    gpus: all
    profiles: ["gpu"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8107/health"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 300s
    restart: unless-stopped

  ministral3:
    build: .
    container_name: ministral-3-3b
    ports:
      - "8084:8084"
    environment:
      PORT: "8084"
      MODEL_FILE: Ministral-3-3B-Instruct-2512-Q4_K_M.gguf
      MODEL_URL: https://huggingface.co/mistralai/Ministral-3-3B-Instruct-2512-GGUF/resolve/main/Ministral-3-3B-Instruct-2512-Q4_K_M.gguf
      N_CTX: ${N_CTX:-2048}
      N_THREADS: ${N_THREADS:-4}
      N_PREDICT: ${N_PREDICT:-256}
      N_PARALLEL: ${N_PARALLEL:-1}
      REASONING: "off"
      REASONING_BUDGET: "0"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/models
    # Q4_K_M weights ~2.15GB (text only; no mmproj)
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    restart: unless-stopped

  minicpm5:
    build: .
    container_name: minicpm5-1b
    ports:
      - "8085:8085"
    environment:
      PORT: "8085"
      MODEL_FILE: MiniCPM5-1B-Q4_K_M.gguf
      MODEL_URL: https://huggingface.co/openbmb/MiniCPM5-1B-GGUF/resolve/main/MiniCPM5-1B-Q4_K_M.gguf
      N_CTX: ${N_CTX:-2048}
      N_THREADS: ${N_THREADS:-4}
      N_PREDICT: ${N_PREDICT:-256}
      N_PARALLEL: ${N_PARALLEL:-1}
      # Hybrid think/no-think via chat template; force off for benchmarks
      REASONING: "off"
      REASONING_BUDGET: "0"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/models
    # Q4_K_M weights ~657MB; runtime ~1.3GB
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  gemma3:
    build: .
    container_name: gemma3-1b
    ports:
      - "8086:8086"
    environment:
      PORT: "8086"
      MODEL_FILE: google_gemma-3-1b-it-Q4_K_M.gguf
      MODEL_URL: https://huggingface.co/bartowski/google_gemma-3-1b-it-GGUF/resolve/main/google_gemma-3-1b-it-Q4_K_M.gguf
      N_CTX: ${N_CTX:-2048}
      N_THREADS: ${N_THREADS:-4}
      N_PREDICT: ${N_PREDICT:-256}
      N_PARALLEL: ${N_PARALLEL:-1}
      REASONING: "off"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/models
    # Q4_K_M weights ~806MB
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  llama32:
    build: .
    container_name: llama3.2-1b
    ports:
      - "8087:8087"
    environment:
      PORT: "8087"
