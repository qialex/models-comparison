      start_period: 300s
    restart: unless-stopped

  # Kokoro-82M TTS — GPU. Port 8131.
  kokoro_82m_gpu:
    build: ./kokoro-82m
    container_name: kokoro-82m-gpu
    ports:
      - "8131:8131"
    environment:
      PORT: "8131"
