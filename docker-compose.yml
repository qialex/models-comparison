      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 900s
    restart: unless-stopped

  # Realistic Vision V5.1 (SD1.5 photoreal) + MSE VAE. ~2–4GB VRAM. CreativeML Open RAIL-M.
  realistic_vision_gpu:
    build: ./realistic-vision
    container_name: realistic-vision-v51-gpu
    ports:
      - "8118:8118"
    environment:
      PORT: "8118"
      MODEL_ID: SG161222/Realistic_Vision_V5.1_noVAE
      VAE_ID: stabilityai/sd-vae-ft-mse
      HF_HOME: /cache/huggingface
      HEIGHT: "768"
      WIDTH: "512"
      STEPS: "30"
      GUIDANCE_SCALE: "5.0"
      DEVICE_MODE: cuda
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - realistic-vision-cache:/cache/huggingface
    gpus: all
    profiles: ["gpu"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8118/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 900s
    restart: unless-stopped

  # Animagine XL 4.0 (anime SDXL). ~8GB VRAM. CreativeML Open RAIL++-M.
  animagine_xl_gpu:
    build: ./animagine-xl
    container_name: animagine-xl-4-gpu
    ports:
      - "8119:8119"
    environment:
      PORT: "8119"
      MODEL_ID: cagliostrolab/animagine-xl-4.0
      HF_HOME: /cache/huggingface
      HEIGHT: "1216"
      WIDTH: "832"
      STEPS: "28"
      GUIDANCE_SCALE: "5.0"
      DEVICE_MODE: cuda
      USE_LPW: "1"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - animagine-xl-cache:/cache/huggingface
    gpus: all
    profiles: ["gpu"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8119/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 900s
    restart: unless-stopped

  # SDXL-Turbo. CFG 0, 1–4 steps, fp16-fix VAE. Commercial: Stability license.
  sdxl_turbo_gpu:
    build: ./sdxl-turbo
    container_name: sdxl-turbo-gpu
    ports:
      - "8120:8120"
    environment:
      PORT: "8120"
      MODEL_ID: stabilityai/sdxl-turbo
      VAE_ID: madebyollin/sdxl-vae-fp16-fix
      HF_HOME: /cache/huggingface
      HEIGHT: "512"
      WIDTH: "512"
      STEPS: "4"
      GUIDANCE_SCALE: "0.0"
      DEVICE_MODE: cuda
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - sdxl-turbo-cache:/cache/huggingface
    gpus: all
    profiles: ["gpu"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8120/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 900s
    restart: unless-stopped

  # Z-Image-Turbo (Tongyi 6B DiT, ~8 NFEs). CFG 0. Card says ~16GB; use offload on 12GB.
  z_image_turbo_gpu:
    build: ./z-image-turbo
    container_name: z-image-turbo-gpu
    ports:
      - "8121:8121"
    environment:
      PORT: "8121"
      MODEL_ID: Tongyi-MAI/Z-Image-Turbo
      HF_HOME: /cache/huggingface
      HEIGHT: "512"
      WIDTH: "512"
      STEPS: "9"
      GUIDANCE_SCALE: "0.0"
      # sequential streams layers (safer on 12GB); offload can pin ~12GB and OOM mid-gen
      DEVICE_MODE: sequential
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - z-image-turbo-cache:/cache/huggingface
    gpus: all
    profiles: ["gpu"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8121/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 1200s
    restart: unless-stopped

  # LTX-Video 2B distilled I2V / multi-condition. Stop other GPU image/video services first.
  ltx_video_gpu:
    build: ./ltx-video
    container_name: ltx-video-2b-gpu
    ports:
      - "8122:8122"
    environment:
      PORT: "8122"
      MODEL_ID: Lightricks/LTX-Video
      TRANSFORMER_FILE: ltxv-2b-0.9.8-distilled.safetensors
      HF_HOME: /cache/huggingface
      HEIGHT: "640"
      WIDTH: "360"
      NUM_FRAMES: "9"
      FPS: "24"
      STEPS: "8"
      GUIDANCE_SCALE: "1.0"
      DECODE_TIMESTEP: "0.05"
      IMAGE_COND_NOISE_SCALE: "0.025"
      DEVICE_MODE: cuda
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      # Host cache so selective hf download and container share weights
      - ./cache/ltx-video:/cache/huggingface
    gpus: all
    profiles: ["gpu"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8122/health"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 1800s
    restart: unless-stopped

  # LTX-Video 2B distilled FP8 (no prompt enhancer). Sibling of ltx_video_gpu; same cache.
  # Stop other GPU video services first (exclusive GPU).
  ltx_video_fp8_gpu:
    build: ./ltx-video-fp8
    container_name: ltx-video-2b-fp8-gpu
    # Override in case a patched/committed image lost the uvicorn CMD.
    entrypoint: ["sh", "-c"]
    command: ["uvicorn app:app --host 0.0.0.0 --port $${PORT}"]
    ports:
      - "8124:8124"
    environment:
      PORT: "8124"
      MODEL_ID: Lightricks/LTX-Video
      TRANSFORMER_FILE: ltxv-2b-0.9.8-distilled-fp8.safetensors
      HF_HOME: /cache/huggingface
      HEIGHT: "576"
      WIDTH: "320"
      NUM_FRAMES: "97"
      FPS: "24"
      GUIDANCE_SCALE: "1.0"
      IMAGE_COND_NOISE_SCALE: "0.025"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./cache/ltx-video:/cache/huggingface
    gpus: all
    profiles: ["gpu"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8124/health"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 1800s
    restart: unless-stopped

  # Wan2.1 T2V 1.3B (Diffusers). Text-to-video; stop other GPU video services first.
  wan_t2v_gpu:
