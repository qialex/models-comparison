  # FLUX.2 [klein] 9B-KV INT8 (quanto) TE↔DiT swap — aims for ~12GB without layer-sequential thrash.
  # Weights: albex123/flux2-klein-kv-qint8-offload (quant of gated NCL 9b-kv). ~5s/img class on 3080 Ti.
  flux2_klein_9b_kv_int8_gpu:
    build: ./flux2-klein-9b-kv-int8
    container_name: flux2-klein-9b-kv-int8-gpu
    ports:
      - "8127:8127"
    environment:
      PORT: "8127"
      MODEL_ID: albex123/flux2-klein-kv-qint8-offload
      HF_HOME: /cache/huggingface
      HEIGHT: "512"
      WIDTH: "512"
      STEPS: "4"
      GUIDANCE_SCALE: "1.0"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - flux2-klein-9b-kv-int8-cache:/cache/huggingface
    gpus: all
    profiles: ["gpu"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8127/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 2400s
    restart: unless-stopped

  # FLUX.2 [klein] 9B-KV (diffusers Flux2KleinKVPipeline). Official ~29GB (5090+).
  # Gated + FLUX Non-Commercial. On 12GB: 512² + sequential offload — may be very slow / OOM.
  flux2_klein_9b_kv_gpu:
    build: ./flux2-klein-9b-kv
    container_name: flux2-klein-9b-kv-gpu
    ports:
      - "8126:8126"
    environment:
      PORT: "8126"
